<div>
    <button (click)="setNegrito()" title="Negrito"><img src="assets/negrito.png"/></button>
    <button (click)="setItalico()" title="Italico"><img src="assets/italico.png"/></button>
    <button (click)="setUnderscore()" title="Sublinhado"><img src="assets/sublinhado.png"/></button>
    <button (click)="onAumentarFonte()" title="Aumentar Fonte"><img src="assets/fonte+.png"/></button>
    <button (click)="onDiminuirFonte()" title="Dimiuir Fonte"><img src="assets/fonte-.png"/></button>
    
    <select title="Cor da Fonte" (change)="mudarCor($event)">
        <option value="black" style="background-color: black; color: whitesmoke;">Preto</option>
        <option value="blue" style="background-color: blue; color: whitesmoke;">Azul</option>
        <option value="cyan" style="background-color: cyan; color: whitesmoke;">Verde</option>
        <option value="red" style="background-color: red; color: whitesmoke;">Vermelho</option>
        <option value="orangered" style="background-color: orangered; color: whitesmoke;">Laranja-Avermelhado</option>
        <option value="orange" style="background-color: orange; color: whitesmoke;">Laranja</option>
        <option value="pink" style="background-color: pink; color: whitesmoke;">Rosa</option>
        <option value="green" style="background-color: green; color: whitesmoke;">Verde</option>
        <option value="olive" style="background-color: olive; color: whitesmoke;">Verde-Oliva</option>
     </select>
    
    <select title="Tamanho da Fonte" (change)="mudarTamanhoFonte($event)">
        <option value=10>10</option>
        <option value=12>12</option>
        <option value=14>14</option>
        <option value=16>16</option>
        <option value=18>18</option>
        <option value=20>20</option>
        <option value=22>22</option>
        <option value=24>24</option>
    </select>
    
    <button (click)="alinharEsquerda()" title="Alinhar à Esqueda"><img src="assets/alinhamento-a-esquerda.png"/></button>
    <button (click)="alinharCentralizado()" title="Alinhar Centralizado"><img src="assets/alinhamento-central.png"/></button>
    <button (click)="alinharDireita()" title="Alinhar à Direita"><img src="assets/alinhamento-a-direita.png"/></button>
    <button (click)="alinharJustificado()" title="Justificado"><img src="assets/justificar-texto.png"/></button>
</div>
